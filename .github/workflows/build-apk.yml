name: Build K - Store Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - name: Backup Admin main.dart
        run: cp lib/main.dart /tmp/main.dart

      - name: Create Flutter Android Project
        run: flutter create --org com.kirzstore --project-name admin .

      - name: Restore Admin Panel Code
        run: cp /tmp/main.dart lib/main.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: k-store-admin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
